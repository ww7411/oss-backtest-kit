name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest (26.04) has no Python 3.9 build for actions/setup-python
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Offline tests (no skipped tests allowed)
        # Full-dependency job only. The example tests skip themselves when
        # matplotlib or nbformat is missing; a skip here means the install
        # step lost them, so any skipped test fails the job.
        shell: bash
        run: |
          python -m pytest -q -rs 2>&1 | tee pytest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -Eq '[0-9]+ skipped' pytest.log; then echo "ERROR: skipped tests are not allowed in CI"; exit 1; fi

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tagged commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Commit ${GITHUB_SHA} is not on main; refusing to release" >&2
            exit 1
          fi
      - name: Tag must equal v plus the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version v${version}" >&2
            exit 1
          fi
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
