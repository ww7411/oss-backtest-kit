[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oss_backtest_kit"
version = "0.1.0"
description = "A small, generic toolkit for crypto strategy research and backtest statistics."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
